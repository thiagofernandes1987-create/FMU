name: FMU M29R integration tests
on:
  push:
    paths:
      - 'integrations/m29r/**'
      - '.github/workflows/m29r-tests.yml'
  pull_request:
jobs:
  kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/m29r
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global typescript@5.9.3
      - run: npm test
      - run: npm run demo
      - run: npm run parity:java
