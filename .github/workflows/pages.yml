name: FMU Web Preview - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'game/src/m23/app/**'
      - 'game/src/m24/**'
      - 'game/src/m25/**'
      - 'game/public/fmu-m24/**'
      - 'game/tools/m24_bundle.js'
      - 'game/package.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'game/src/m23/app/**'
      - 'game/src/m24/**'
      - 'game/src/m25/**'
      - 'game/public/fmu-m24/**'
      - 'game/tools/m24_bundle.js'
      - 'game/package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fmu-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        run: npm install --global typescript@5.9.3
      - name: Run complete FMU integration test suite
        working-directory: game
        run: npm test
      - name: Compile browser bundle from source
        working-directory: game
        run: npm run m24:bundle
      - name: Check static assets and relative URLs
        working-directory: game
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='public/fmu-m24/';
          const html=fs.readFileSync(path+'index.html','utf8');
          for(const asset of ['app.css','app.bundle.js']) {
            if(!fs.statSync(path+asset).size || !html.includes('./'+asset))
              throw Error('Missing relative asset '+asset);
          }
          if(!html.includes('viewport'))throw Error('Missing viewport metadata');
          if(!html.includes('demonstração') && !html.includes('dados fictícios'))
            throw Error('Missing demo disclaimer');
          console.log('FMU static Pages build passed, project path is relative');
          NODE
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/public/fmu-m24

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish FMU Preview
        id: deployment
        uses: actions/deploy-pages@v4